<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tạo form và các điều khiển</title>

    <script>
        function xuLyDongY() {
            document.getElementById("divThongBao").innerText = "Bạn đã đăng ký thành công!!!";
        }
    </script>
</head>
<body>

    <form id="frmDangKyDuLich">
        <table align="center" border="1" cellpadding="5" cellspacing="0" style="border-collapse: collapse; background-color: #ffffcc; border-color: #ccc; width: 480px; font-family: Arial, sans-serif;">
            
            <tr>
                <td colspan="2" align="center" style="background-color: white; border: none;">
                    <h2 style="color: #006699; margin: 10px 0;">Đăng ký du lịch</h2>
                </td>
            </tr>

            <tr>
                <td width="30%" style="color: #006699;">Họ và tên</td>
                <td>
                    <input type="text" id="txtHoTen" size="30" value="Trần Nhật Tiến">
                </td>
            </tr>

            <tr>
                <td style="color: #006699;">Địa chỉ</td>
                <td>
                    <input type="text" id="txtDiaChi" size="25" value="8/3b Trần Thị Điệu">
                </td>
            </tr>

            <tr>
                <td style="color: #006699;">Điện thoại</td>
                <td>
                    <input type="text" id="txtDienThoai" size="15" value="8351056">
                </td>
            </tr>

            <tr>
                <td style="color: #006699;">Khách Việt Nam</td>
                <td>
                    <input type="checkbox" id="chkKhachVN" checked>
                </td>
            </tr>

            <tr>
                <td style="color: #006699;">Chọn tour</td>
                <td>
                    <select id="slTour" style="width: 250px;">
                        <optgroup label="Miền Bắc">
                            <option value="Hạ Nội - Hạ Long - Sapa">Hạ Nội - Hạ Long - Sapa</option>
                            <option value="Hạ Nội - Chùa Hương - Ninh Bình">Hạ Nội - Chùa Hương - Ninh Bình</option>
                            <option value="Hạ Nội - Cát Bà - Tuần Châu">Hạ Nội - Cát Bà - Tuần Châu</option>
                        </optgroup>
                        <optgroup label="Miền Trung">
                            <option value="Huế - Bạch Mã - Đà Nẵng">Huế - Bạch Mã - Đà Nẵng</option>
                            <option value="Nha Trang - Đà Lạt">Nha Trang - Đà Lạt</option>
                            <option value="Buôn mê thuột - Gia lai - Kontum" selected>Buôn mê thuột - Gia lai - Kontum</option>
                        </optgroup>
                        <optgroup label="Miền Nam">
                            <option value="TP.HCM - Cần Thơ - Cà Mau">TP.HCM - Cần Thơ - Cà Mau</option>
                            <option value="TP.HCM - Mỹ Tho">TP.HCM - Mỹ Tho</option>
                        </optgroup>
                    </select>
                </td>
            </tr>

            <tr>
                <td style="color: #006699;">Phương tiện</td>
                <td>
                    <input type="radio" name="rdPhuongTien" id="rdMayBay" value="Máy bay"> Máy bay
                    <input type="radio" name="rdPhuongTien" id="rdOTo" value="Xe ô tô" checked> Xe ô tô
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <fieldset style="border: 2px solid #800000; width: 350px; height: 55px;">
                        <legend align="center" style="font-style: italic; color: #800000; font-weight: bold;">Số lượng đoàn khách</legend>
                        Người lớn <input type="text" id="txtNguoiLon" size="3" value="6">
                        &nbsp;&nbsp;&nbsp;&nbsp;
                        Trẻ em <input type="text" id="txtTreEm" size="3" value="4">
                    </fieldset>
                </td>
            </tr>

            <tr>
                <td style="color: #006699;">Ghi chú thêm</td>
                <td>
                    <textarea id="txtGhiChu" rows="3" style="width: 300px;">Có mang theo hành lí
Tôi đang ăn chay</textarea>
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="button" id="btnDongY" value="Đồng ý" onclick="xuLyDongY()"><br>
                    <!-- Tag <div> và t.t id để xuất thông báo -->
                    <div id="divThongBao" style="color: #ff9900; font-weight: bold; margin-top: 5px;"></div>
                </td>
            </tr>

        </table>

    </form>

</body>
</html>
